<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   img-src ${cspSource} https: data: blob:;
                   style-src ${cspSource} 'unsafe-inline';
                   script-src 'nonce-${nonce}';
                   connect-src 'none';" />
    <link rel="stylesheet" href="${styleUri}" />
    <title>Emulator</title>
  </head>
  <body>
    <div id="stage">
      <div id="screen-area">
        <img id="screen" alt="" tabindex="0" />
        <div id="status">
          <div class="spinner"></div>
          <div id="status-text">Starting emulator…</div>
          <pre id="log"></pre>
        </div>
      </div>
      <div id="footer">
        <div id="footer-status"></div>
        <div id="toolbar">
          <button type="button" class="tb-btn" data-button="recent" title="Recent apps" aria-label="Recent apps">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
          <button type="button" class="tb-btn" data-button="home" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script nonce="${nonce}" src="${scriptUri}"></script>
  </body>
</html>
